<!DOCTYPE html>
<html lang="en">
<!--
  DATA ENGINE — Standalone Swagger UI
  ====================================
  Open this file directly in a browser — no server needed.
  It loads Swagger UI from CDN and points at your running services.

  HOW IT WORKS
  ─────────────
  1. Open the file:  open docs/swagger_ui.html   (or double-click it)
  2. Pick a service from the top-bar dropdown
  3. The UI fetches that service's /openapi.json live from localhost
  4. Hit "Authorize" to paste your JWT or API Key once — persists across switches
  5. Hit "Try it out" on any endpoint and fire real requests

  REQUIREMENTS
  ─────────────
  - The target service must be running locally (CORS is open on all services)
  - An internet connection (CDN assets: Swagger UI 5.17, Inter font)

  FOR UNIFIED VIEW (all services merged)
  ───────────────────────────────────────
  Start the docs server first:
      python docs/swagger_server.py
  Then pick "All Services (Unified)" in the dropdown — it loads from port 8099.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA ENGINE — API Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />

  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #151824;
      --surface2:  #1c2030;
      --border:    #252a3d;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #6366f1;
      --accent2:   #8b5cf6;
      --green:     #22c55e;
      --yellow:    #f59e0b;
      --red:       #ef4444;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
    }

    /* ── Top bar ────────────────────────────────────────────────── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(0,0,0,.5);
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .04em;
      white-space: nowrap;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      -webkit-text-fill-color: white;
      flex-shrink: 0;
    }

    .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

    .select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 240px;
      max-width: 380px;
    }

    .select-wrap label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      white-space: nowrap;
    }

    #service-select {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color .15s;
    }
    #service-select:focus { outline: none; border-color: var(--accent); }
    #service-select optgroup { color: var(--muted); font-size: 11px; }

    /* ── Status pill ────────────────────────────────────────────── */
    #status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      transition: background .3s, box-shadow .3s;
    }
    #status-dot.loading {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
      animation: blink 1s ease-in-out infinite;
    }
    #status-dot.error {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }
    @keyframes blink { 50% { opacity: .25; } }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover  { opacity: .85; }
    .btn:active { transform: scale(.97); }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost     { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    /* ── Info bar under topbar ──────────────────────────────────── */
    #infobar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    #infobar a { color: var(--accent); text-decoration: none; }
    #infobar a:hover { text-decoration: underline; }
    #infobar .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
    }
    .tag-green { border-color: rgba(34,197,94,.3); color: var(--green); }
    .tag-purple { border-color: rgba(99,102,241,.3); color: var(--accent); }

    /* ── Swagger UI container ───────────────────────────────────── */
    #swagger-ui {
      padding: 0 20px 60px;
      min-height: calc(100vh - 110px);
    }

    /* ── Swagger UI theme overrides ─────────────────────────────── */
    .swagger-ui { background: transparent !important; }
    .swagger-ui .topbar { display: none !important; }

    .swagger-ui .information-container { padding: 16px 0 8px !important; }
    .swagger-ui .info .title { color: var(--text) !important; font-size: 24px !important; }
    .swagger-ui .info .description p,
    .swagger-ui .info .description li { color: #94a3b8 !important; }
    .swagger-ui .info .description a,
    .swagger-ui .info .description code { color: var(--accent) !important; }
    .swagger-ui .info .description h3 { color: var(--text) !important; }

    .swagger-ui .scheme-container {
      background: var(--surface) !important;
      padding: 14px 20px !important;
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      margin-bottom: 16px !important;
      box-shadow: none !important;
    }
    .swagger-ui .scheme-container label { color: #94a3b8 !important; font-size: 12px !important; }

    .swagger-ui .opblock-tag {
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
      font-size: 15px !important;
      font-weight: 600 !important;
    }
    .swagger-ui .opblock-tag:hover { background: var(--surface2) !important; }

    .swagger-ui .opblock {
      border-radius: 8px !important;
      margin-bottom: 6px !important;
      border: 1px solid var(--border) !important;
    }
    .swagger-ui .opblock .opblock-summary {
      border-radius: 8px !important;
      padding: 10px 14px !important;
    }
    .swagger-ui .opblock.is-open .opblock-summary { border-radius: 8px 8px 0 0 !important; }
    .swagger-ui .opblock-body { background: var(--surface) !important; border-radius: 0 0 8px 8px !important; }

    .swagger-ui .opblock-summary-description { color: #94a3b8 !important; }
    .swagger-ui .opblock-summary-path { color: var(--text) !important; font-weight: 500 !important; }

    .swagger-ui input[type=text],
    .swagger-ui input[type=password],
    .swagger-ui textarea,
    .swagger-ui select {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      font-family: 'Inter', monospace !important;
    }
    .swagger-ui input:focus, .swagger-ui textarea:focus {
      border-color: var(--accent) !important;
      outline: none !important;
    }

    .swagger-ui .btn { border-radius: 6px !important; font-family: inherit !important; }
    .swagger-ui .btn.execute { background: var(--accent) !important; border-color: var(--accent) !important; }
    .swagger-ui .btn.authorize { background: transparent !important; color: var(--green) !important; border-color: var(--green) !important; }

    .swagger-ui table thead tr th,
    .swagger-ui table thead tr td { color: var(--muted) !important; border-color: var(--border) !important; }
    .swagger-ui table tbody tr td { color: var(--text) !important; border-color: var(--border) !important; }

    .swagger-ui .parameter__name { color: var(--text) !important; }
    .swagger-ui .parameter__type { color: #94a3b8 !important; }
    .swagger-ui .parameter__deprecated { color: var(--red) !important; }

    .swagger-ui .response-col_status { color: var(--text) !important; }
    .swagger-ui .response-col_description { color: #94a3b8 !important; }

    .swagger-ui section.models {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      margin-top: 24px !important;
      padding: 8px !important;
    }
    .swagger-ui section.models h4 { color: var(--text) !important; }
    .swagger-ui .model-title { color: var(--text) !important; }
    .swagger-ui .model { color: #94a3b8 !important; }

    /* ── Toast notifications ────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast-item {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      animation: slideIn .2s ease;
      max-width: 320px;
    }
    .toast-item.success { border-color: rgba(34,197,94,.4); color: var(--green); }
    .toast-item.error   { border-color: rgba(239,68,68,.4);  color: var(--red); }
    .toast-item.info    { border-color: rgba(99,102,241,.4); color: var(--accent); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } }

    /* ── Loading overlay ────────────────────────────────────────── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(13,15,26,.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading.visible { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 13px; }
  </style>
</head>

<body>

<!-- ── Top bar ───────────────────────────────────────────────────────────── -->
<div id="topbar">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    DATA ENGINE
  </div>

  <div class="divider"></div>

  <div class="select-wrap">
    <label for="service-select">SERVICE</label>
    <select id="service-select" onchange="switchService(this.value)">
      <optgroup label="── Unified ──">
        <option value="http://localhost:8099/openapi.json">
          All Services (Unified) — requires docs server
        </option>
      </optgroup>
      <optgroup label="── Core Pipeline ──">
        <option value="http://localhost:8001/openapi.json">Ingestion Service :8001</option>
        <option value="http://localhost:8002/openapi.json">Chunking Service :8002</option>
        <option value="http://localhost:8003/openapi.json">Embedding Service :8003</option>
        <option value="http://localhost:8004/openapi.json">Vector Vault :8004</option>
      </optgroup>
      <optgroup label="── Intelligence ──">
        <option value="http://localhost:8006/openapi.json">Trend Scraper :8006</option>
        <option value="http://localhost:8007/openapi.json">Semantic Engine :8007</option>
        <option value="http://localhost:8008/openapi.json">Gap Detection + Quality Score :8008</option>
        <option value="http://localhost:8009/openapi.json">Schema Factory :8009</option>
      </optgroup>
      <optgroup label="── Optimisation Stack ──">
        <option value="http://localhost:8012/openapi.json">SEO Engine :8012</option>
        <option value="http://localhost:8013/openapi.json">GEO + LEO + VSEO Engine :8013</option>
        <option value="http://localhost:8014/openapi.json">AEO Engine :8014</option>
      </optgroup>
      <optgroup label="── Infrastructure ──">
        <option value="http://localhost:8000/openapi.json">API Gateway :8000</option>
        <option value="http://localhost:8010/openapi.json">Synchronization :8010</option>
        <option value="http://localhost:8011/openapi.json">Dashboard Backend :8011</option>
      </optgroup>
    </select>
  </div>

  <div id="status-pill">
    <div id="status-dot" class="loading"></div>
    <span id="status-text">Loading…</span>
  </div>

  <div class="divider"></div>

  <button class="btn btn-secondary" onclick="checkHealth()" title="Ping the selected service /health">
    ♥ Health
  </button>
  <button class="btn btn-ghost" onclick="copySpecUrl()" title="Copy spec URL to clipboard">
    ⎘ Copy URL
  </button>
  <button class="btn btn-primary" onclick="downloadSpec()" title="Download YAML spec">
    ⬇ YAML
  </button>
</div>

<!-- ── Info bar ──────────────────────────────────────────────────────────── -->
<div id="infobar">
  <span id="spec-url-label" style="font-family:monospace; color: var(--accent); font-size:11px;">
    http://localhost:8099/openapi.json
  </span>
  <span class="tag tag-purple">OpenAPI 3.1</span>
  <span class="tag tag-green">Gemini default provider</span>
  <span id="endpoint-count" class="tag">— endpoints</span>
  <span style="flex:1"></span>
  <a href="http://localhost:8099/redoc" target="_blank">ReDoc ↗</a>
  <a href="http://localhost:8099/services" target="_blank">Service Status ↗</a>
  <a href="http://localhost:8099/openapi.yaml" target="_blank">Download YAML ↗</a>
</div>

<!-- ── Swagger UI mount ───────────────────────────────────────────────────── -->
<div id="swagger-ui"></div>

<!-- ── Toast container ───────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Loading overlay ───────────────────────────────────────────────────── -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">Fetching OpenAPI spec…</p>
</div>

<!-- ── Scripts ───────────────────────────────────────────────────────────── -->
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────
let ui            = null;
let currentSpecUrl = "";
let currentBaseUrl = "";

// ── Helpers ───────────────────────────────────────────────────────────────────

function setStatus(state, text) {
  const dot  = document.getElementById("status-dot");
  const span = document.getElementById("status-text");
  dot.className  = state === "loading" ? "loading" : state === "error" ? "error" : "";
  span.textContent = text;
}

function toast(msg, type = "info", duration = 3500) {
  const el = document.createElement("div");
  el.className  = `toast-item ${type}`;
  el.textContent = msg;
  document.getElementById("toast").appendChild(el);
  setTimeout(() => el.remove(), duration);
}

function showLoading(msg = "Fetching OpenAPI spec…") {
  document.getElementById("loading-msg").textContent = msg;
  document.getElementById("loading").classList.add("visible");
}
function hideLoading() {
  document.getElementById("loading").classList.remove("visible");
}

function countEndpoints(spec) {
  if (!spec || !spec.paths) return 0;
  return Object.values(spec.paths)
    .flatMap(p => Object.keys(p).filter(m => ["get","post","put","patch","delete"].includes(m)))
    .length;
}

// ── Core: build/rebuild Swagger UI ───────────────────────────────────────────

function buildUI(specUrl) {
  currentSpecUrl = specUrl;

  // Derive base URL from the spec URL (strip /openapi.json)
  currentBaseUrl = specUrl.replace(/\/openapi\.json$/, "");

  document.getElementById("spec-url-label").textContent = specUrl;
  setStatus("loading", "Loading spec…");
  showLoading(`Fetching spec from ${specUrl}`);

  // Destroy previous UI
  if (ui) {
    try { ui = null; } catch(_) {}
    document.getElementById("swagger-ui").innerHTML = "";
  }

  // Fetch spec first so we can count endpoints
  fetch(specUrl)
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(spec => {
      const n = countEndpoints(spec);
      document.getElementById("endpoint-count").textContent = `${n} endpoints`;

      ui = SwaggerUIBundle({
        url:             specUrl,
        dom_id:          "#swagger-ui",
        presets:         [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout:          "StandaloneLayout",
        deepLinking:     true,
        displayRequestDuration: true,
        filter:          true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: req => {
          // Ensure requests go to the right service base URL
          return req;
        },
        onComplete: () => {
          setStatus("ok", "Spec loaded");
          hideLoading();
          toast(`✓ Loaded ${n} endpoints`, "success");
        },
      });
    })
    .catch(err => {
      setStatus("error", "Unreachable");
      hideLoading();
      document.getElementById("swagger-ui").innerHTML = `
        <div style="padding:60px 24px; text-align:center; color:#64748b;">
          <p style="font-size:48px; margin-bottom:16px;">⚠️</p>
          <p style="font-size:18px; color:#e2e8f0; margin-bottom:8px;">Service unreachable</p>
          <p style="margin-bottom:24px;">${specUrl}</p>
          <p style="font-size:13px;">Make sure the service is running, then click <strong>↻ Retry</strong> below.</p>
          <br/>
          <button class="btn btn-primary" onclick="buildUI('${specUrl}')" style="margin:auto;">
            ↻ Retry
          </button>
        </div>`;
      toast(`✗ Could not reach ${specUrl}`, "error", 5000);
    });
}

// ── Service switcher ──────────────────────────────────────────────────────────

function switchService(url) {
  buildUI(url);
}

// ── Health check ──────────────────────────────────────────────────────────────

function checkHealth() {
  const healthUrl = currentBaseUrl + "/health";
  setStatus("loading", "Checking…");
  fetch(healthUrl)
    .then(r => r.json())
    .then(data => {
      const status = data.status || "unknown";
      if (status === "healthy") {
        setStatus("ok", "Healthy");
        toast(`♥ ${healthUrl} → ${status}`, "success");
      } else {
        setStatus("error", status);
        toast(`⚠ ${healthUrl} → ${status}`, "error");
      }
    })
    .catch(() => {
      setStatus("error", "Unreachable");
      toast(`✗ ${healthUrl} unreachable`, "error");
    });
}

// ── Spec URL copy ─────────────────────────────────────────────────────────────

function copySpecUrl() {
  navigator.clipboard.writeText(currentSpecUrl)
    .then(() => toast("Spec URL copied to clipboard", "info"))
    .catch(() => toast("Could not copy — check browser permissions", "error"));
}

// ── YAML download ─────────────────────────────────────────────────────────────

function downloadSpec() {
  // If docs server is running, grab the YAML endpoint; otherwise convert JSON → YAML in browser
  const yamlUrl = currentBaseUrl.includes("8099")
    ? "http://localhost:8099/openapi.yaml"
    : currentBaseUrl + "/openapi.json";

  if (currentBaseUrl.includes("8099")) {
    window.open(yamlUrl, "_blank");
    toast("Downloading YAML…", "info");
  } else {
    // Fallback: download JSON (browser can't convert to YAML without a library)
    const a = document.createElement("a");
    a.href = currentSpecUrl;
    a.download = "openapi.json";
    a.click();
    toast("Downloading JSON spec (start docs server for YAML export)", "info");
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────

// Default: try the unified docs server; fall back to API gateway
(async () => {
  const defaultUrl = "http://localhost:8099/openapi.json";
  try {
    const probe = await fetch(defaultUrl, { signal: AbortSignal.timeout(2000) });
    if (probe.ok) {
      document.getElementById("service-select").value = defaultUrl;
      buildUI(defaultUrl);
      return;
    }
  } catch (_) { /* docs server not running — fall back */ }

  // Docs server offline — load API gateway spec directly
  const fallback = "http://localhost:8000/openapi.json";
  document.getElementById("service-select").value = fallback;
  buildUI(fallback);
  toast("Docs server offline — showing API Gateway only. Run: python docs/swagger_server.py", "info", 7000);
})();
</script>

</body>
</html>
