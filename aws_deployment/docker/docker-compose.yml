# ============================================================
# Tek Juice Data Engine — Docker Compose
# All services communicate internally; app is exposed on 9600
# ============================================================

version: "3.9"

services:

  # ── Main Application ────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: aws_deployment/docker/Dockerfile
    container_name: tek_juice_app
    restart: always
    ports:
      - "9600:9600"
    environment:
      - ENV=production
      - PORT=9600
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tek_juice_net
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tek_juice_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tek_juice_db}
      POSTGRES_USER: ${POSTGRES_USER:-tek_juice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schemas:/docker-entrypoint-initdb.d
    networks:
      - tek_juice_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tek_juice_user} -d ${POSTGRES_DB:-tek_juice_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache / Queue ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tek_juice_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - tek_juice_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: tek_juice_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - tek_juice_net

  # ── Telemetry Worker ─────────────────────────────────────────
  telemetry_worker:
    build:
      context: ../..
      dockerfile: aws_deployment/docker/Dockerfile
    container_name: tek_juice_telemetry
    restart: always
    command: ["python", "-m", "services.telemetry_service.worker"]
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - tek_juice_net

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  app_logs:
  nginx_logs:

# ── Networks ───────────────────────────────────────────────────
networks:
  tek_juice_net:
    driver: bridge
