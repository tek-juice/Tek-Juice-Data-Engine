# ============================================================
# Tek Juice Data Engine — Docker Compose
# All services communicate internally; app is exposed on 9600
# ============================================================

version: "3.9"

services:

  # ── Main Application ────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: aws_deployment/docker/Dockerfile
    container_name: tek_juice_app
    restart: always
    ports:
      - "9600:9600"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - GATEWAY_PORT=9600
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=tekjuice-stage.crs2y40iif4i.us-east-1.rds.amazonaws.com
      - POSTGRES_PORT=3306
      - PGBOUNCER_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tek_juice_net
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Redis Cache / Queue ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tek_juice_redis
    restart: always
    command: redis-server --requirepass TekJuiceRedis2026! --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - tek_juice_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "TekJuiceRedis2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Telemetry Worker ─────────────────────────────────────────
  telemetry_worker:
    build:
      context: ../..
      dockerfile: aws_deployment/docker/Dockerfile
    container_name: tek_juice_telemetry
    restart: always
    command: ["python", "-m", "services.telemetry_service.worker"]
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - POSTGRES_HOST=tekjuice-stage.crs2y40iif4i.us-east-1.rds.amazonaws.com
      - PGBOUNCER_ENABLED=false
    depends_on:
      - redis
    networks:
      - tek_juice_net

# ── Volumes ────────────────────────────────────────────────────
volumes:
  redis_data:
  app_logs:

# ── Networks ───────────────────────────────────────────────────
networks:
  tek_juice_net:
    driver: bridge
