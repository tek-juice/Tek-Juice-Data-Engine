version: "3.9"

# ─────────────────────────────────────────────
# DATA ENGINE — Docker Compose
# Local development stack
# ─────────────────────────────────────────────

networks:
  data_engine_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  storage_uploads:
  storage_vectors:

services:

  # ── PostgreSQL + PGVector ──────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: data_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_engine}
      POSTGRES_USER: ${POSTGRES_USER:-data_engine_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"           # direct access for migrations/admin only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    networks:
      - data_engine_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_engine_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer — Connection Pooler ─────────
  # Sits between all app services and PostgreSQL.
  # Prevents connection exhaustion when Celery scales to 16+ workers.
  # All services connect to pgbouncer:6432, NOT postgres:5432.
  pgbouncer:
    image: bitnami/pgbouncer:1.22.1
    container_name: data_engine_pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST:         postgres
      POSTGRESQL_PORT:         5432
      POSTGRESQL_DATABASE:     ${POSTGRES_DB:-data_engine}
      POSTGRESQL_USERNAME:     ${POSTGRES_USER:-data_engine_user}
      POSTGRESQL_PASSWORD:     ${POSTGRES_PASSWORD:-password}
      PGBOUNCER_PORT:          6432
      PGBOUNCER_POOL_MODE:     transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_SERVER_LIFETIME: 3600
      PGBOUNCER_LOG_CONNECTIONS: yes
      PGBOUNCER_LOG_DISCONNECTIONS: yes
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_engine_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-data_engine_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: data_engine_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - data_engine_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway ───────────────────────────
  api_gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: data_engine_gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Ingestion Service ─────────────────────
  ingestion_service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: ingestion_service
    container_name: data_engine_ingestion
    restart: unless-stopped
    env_file: .env
    ports:
      - "${INGESTION_SERVICE_PORT:-8001}:8001"
    volumes:
      - storage_uploads:/app/storage/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Embedding Service ─────────────────────
  embedding_service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: embedding_service
    container_name: data_engine_embedding
    restart: unless-stopped
    env_file: .env
    ports:
      - "${EMBEDDING_SERVICE_PORT:-8003}:8003"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Vector Vault ──────────────────────────
  vector_vault:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: vector_vault
    container_name: data_engine_vector_vault
    restart: unless-stopped
    env_file: .env
    ports:
      - "${VECTOR_VAULT_PORT:-8004}:8004"
    volumes:
      - storage_vectors:/app/storage/vectors
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Telemetry Service ─────────────────────
  telemetry_service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: telemetry_service
    container_name: data_engine_telemetry
    restart: unless-stopped
    env_file: .env
    ports:
      - "${TELEMETRY_SERVICE_PORT:-8005}:8005"
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Celery Worker ─────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: data_engine_celery
    restart: unless-stopped
    env_file: .env
    command: celery -A workers.celery.app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Celery Beat (Scheduler) ───────────────
  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: data_engine_celery_beat
    restart: unless-stopped
    env_file: .env
    command: celery -A workers.celery.app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Dashboard Backend ─────────────────────
  dashboard_backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: dashboard_backend
    container_name: data_engine_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DASHBOARD_BACKEND_PORT:-8011}:8011"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data_engine_net

  # ── Nginx Reverse Proxy ───────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: data_engine_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api_gateway
    networks:
      - data_engine_net

  # ── Prometheus ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: data_engine_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data_engine_net

  # ── Grafana ───────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: data_engine_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - data_engine_net
