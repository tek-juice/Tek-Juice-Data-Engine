;; DATA ENGINE — PgBouncer Configuration
;; Connection pooler between Celery workers / FastAPI services and PostgreSQL.
;; Prevents connection exhaustion when Celery scales to 16+ concurrent workers.
;;
;; Architecture:
;;   All services connect to pgbouncer:6432 (NOT postgres:5432 directly)
;;   PgBouncer maintains a small pool of real PostgreSQL connections
;;   and multiplexes many application connections onto them.
;;
;; Pool mode: transaction (best for async FastAPI + Celery use case)
;;   - Connection is returned to pool after each transaction completes
;;   - Allows 100s of app connections to share ~20 real DB connections
;;   - Required: use NullPool in SQLAlchemy (already configured in database.py)

[databases]
;; Route all connections for data_engine DB through to postgres service
data_engine = host=postgres port=5432 dbname=data_engine

[pgbouncer]
;; Network
listen_addr         = 0.0.0.0
listen_port         = 6432

;; Auth — use MD5 password auth matching PostgreSQL
auth_type           = md5
auth_file           = /etc/pgbouncer/userlist.txt

;; Pool settings
pool_mode           = transaction
max_client_conn     = 200          ;; max simultaneous app connections
default_pool_size   = 20           ;; real PostgreSQL connections per database/user pair
min_pool_size       = 5            ;; keep minimum connections warm
reserve_pool_size   = 5            ;; emergency reserve for spikes
reserve_pool_timeout = 3.0         ;; seconds before using reserve pool

;; Connection lifecycle
server_idle_timeout = 600          ;; close idle server connections after 10 min
client_idle_timeout = 0            ;; never close idle client connections
server_lifetime     = 3600         ;; recycle server connections every hour
server_connect_timeout = 10        ;; fail fast if postgres is unreachable

;; Health check — keeps connections alive and detects dead postgres
server_check_query  = SELECT 1
server_check_delay  = 30

;; Logging
log_connections     = 1
log_disconnections  = 1
log_pooler_errors   = 1
stats_period        = 60

;; Admin interface — connect as pgbouncer user to run SHOW STATS etc.
admin_users         = pgbouncer_admin
stats_users         = pgbouncer_admin

;; PID
pidfile             = /var/run/pgbouncer/pgbouncer.pid
