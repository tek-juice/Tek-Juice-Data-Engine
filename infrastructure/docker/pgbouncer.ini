[databases]
; Route all connections to the real postgres container.
; * means "any database name the client asks for" → forwards to data_engine db.
data_engine = host=postgres port=5432 dbname=data_engine

[pgbouncer]
listen_addr         = 0.0.0.0
listen_port         = 6432

; Authentication — userlist.txt holds the hashed passwords
auth_type           = md5
auth_file           = /etc/pgbouncer/userlist.txt

; Pool settings
pool_mode           = transaction
max_client_conn     = 200
default_pool_size   = 20
min_pool_size       = 5
reserve_pool_size   = 5
reserve_pool_timeout = 3

; Connection lifetime / idle timeouts
server_idle_timeout  = 600
server_lifetime      = 3600

; Logging
log_connections      = 1
log_disconnections   = 1
log_pooler_errors    = 1

; Required for health checks
ignore_startup_parameters = extra_float_digits
