[databases]
; Route connections to postgres container
data_engine = host=postgres port=5432 dbname=data_engine user=data_engine_user password=TekJuice@2026!

[pgbouncer]
listen_addr          = 0.0.0.0
listen_port          = 6432

; Use plain-text auth with userlist.txt — safe inside private Docker network.
; PgBouncer connects to Postgres using the credentials in [databases] above,
; so scram-sha-256 negotiation happens server-side automatically.
auth_type            = plain
auth_file            = /etc/pgbouncer/userlist.txt

; Pool settings
pool_mode            = transaction
max_client_conn      = 200
default_pool_size    = 20
min_pool_size        = 5
reserve_pool_size    = 5
reserve_pool_timeout = 3

; Timeouts
server_idle_timeout  = 600
server_lifetime      = 3600

; Logging
log_connections      = 1
log_disconnections   = 1
log_pooler_errors    = 1

; Compatibility
ignore_startup_parameters = extra_float_digits
