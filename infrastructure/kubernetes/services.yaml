# DATA ENGINE — Kubernetes Services
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: data-engine
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: data-engine
spec:
  selector:
    app: ingestion-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: data-engine
spec:
  selector:
    app: embedding-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vector-vault
  namespace: data-engine
spec:
  selector:
    app: vector-vault
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: data-engine
spec:
  selector:
    app: dashboard-backend
  ports:
    - protocol: TCP
      port: 8011
      targetPort: 8011
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-engine-config
  namespace: data-engine
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_LOG_LEVEL: "INFO"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "data_engine"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DEFAULT_EMBEDDING_PROVIDER: "openai"
  CHUNK_MIN_TOKENS: "256"
  CHUNK_MAX_TOKENS: "512"
  CHUNK_OVERLAP_TOKENS: "64"
