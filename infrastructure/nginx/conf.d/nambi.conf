server {
    listen 80;
    server_name chatbot.everything-uganda.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chatbot.everything-uganda.com;

    ssl_certificate /etc/letsencrypt/live/chatbot.everything-uganda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.everything-uganda.com/privkey.pem;

    # Security headers
    # X-Frame-Options is intentionally omitted here so the chatbot
    # can be embedded by the Everything Uganda website.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors https://everythinguganda.com https://www.everythinguganda.com" always;

    location /api/ {
        proxy_pass http://nambi:9300;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://nambi-frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
