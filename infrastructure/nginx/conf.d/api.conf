# DATA ENGINE — API Virtual Host
# Listens on 8080/8443 to avoid conflict with the host's primary nginx on 80/443.
# The host nginx routes traffic here by Host header (server_name below).
server {
    listen 8080;
    server_name api.tekjuice.io tekjuice.io;

    # Redirect all HTTP to HTTPS
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name api.tekjuice.io tekjuice.io;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Request ID ────────────────────────────────
    add_header X-Request-ID $request_id always;

    client_max_body_size 110m;

    # ── API Gateway ───────────────────────────────
    location /api/ {
        limit_req zone=api_standard burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 16k;
    }

    # ── Health Check (no auth required) ──────────
    location /health {
        proxy_pass http://api_gateway/health;
        access_log off;
    }

    # ── Metrics (restrict to internal) ───────────
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api_gateway/metrics;
    }

    # ── Root / Catch-all ─────────────────────────
    location / {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
