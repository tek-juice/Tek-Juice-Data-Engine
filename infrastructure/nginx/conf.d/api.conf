# DATA ENGINE — API Virtual Host
# TLS is terminated by the host nginx (which owns 80/443 via Certbot).
# This container nginx listens on plain HTTP 9600 — host nginx proxy_passes here.
server {
    listen 9600;
    server_name _;

    # ── Request ID ────────────────────────────────
    add_header X-Request-ID $request_id always;

    client_max_body_size 110m;

    # ── API Gateway ───────────────────────────────
    location /api/ {
        limit_req zone=api_standard burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 16k;
    }

    # ── Health Check (no auth required) ──────────
    location /health {
        proxy_pass http://api_gateway/health;
        access_log off;
    }

    # ── Metrics (restrict to internal) ───────────
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api_gateway/metrics;
    }

    # ── Root / Catch-all ─────────────────────────
    location / {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
